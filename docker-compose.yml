services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-reservo}
      POSTGRES_USER: ${DB_USERNAME:-reservo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - reservo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-reservo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    networks:
      - reservo_net
    env_file:
      - .env

  # One-shot: builds the React app into the volume nginx serves on port 80.
  frontend-build:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - build_node_modules:/app/node_modules
      - frontend_dist:/app/dist
    networks:
      - reservo_net
    command: sh -c "npm ci --prefer-offline --no-audit --no-fund --fetch-retries=5 && npm run build"
    restart: "no"

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
      - frontend_dist:/var/www/frontend:ro
    networks:
      - reservo_net

  node:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - reservo_net
    command: sh -c "npm install --prefer-dedupe && npm run dev -- --host"

volumes:
  pgdata:
  frontend_dist:
  node_modules:
  build_node_modules:

networks:
  reservo_net:
    driver: bridge
